name: Build Storefront Test

on:
  pull_request:
    paths:
      - 'apps/storefront-test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-storefront-test.yml'
  push:
    branches: [main]
    paths:
      - 'apps/storefront-test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-storefront-test.yml'

jobs:
  build-storefront-test:
    name: Build Storefront Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build storefront-test
        run: npm run build:storefront-test
        env:
          VENDURE_SHOP_API_URL: https://readonlydemo.vendure.io/shop-api
